# Model lineup for Quorum. Owned by Gideon; Elikem uses the Model Manager UI instead.
#
# Ollama models that are pulled locally are discovered automatically, so this file is only for
# things discovery cannot know: a pinned judge, and OpenAI-compatible endpoints.
#
# The lineup waits on hardware: this machine is an Apple M2 with 8 GB of memory, which fits one
# 3-4B model (4-bit) at a time. Three families plus a judge means running them one after another.

# Model id used as the judge when a run does not name one (e.g. ollama:qwen2.5:3b). Optional.
judge: null

# Extra models. Same fields as POST /models.
