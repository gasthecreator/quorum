name: backend
on:
  pull_request:
    paths: ["backend/**", "contracts/**", "config/**", "packs/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check quorum tests scripts
      - run: python scripts/export_contracts.py --check
      - run: pytest -q
