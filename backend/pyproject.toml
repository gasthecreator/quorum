[project]
name = "quorum"
version = "0.1.0"
description = "Quorum backend: debate engine, calibration, evaluation and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
grounding = ["semgrep>=1.80"]
mcp = ["mcp>=1.2"]

[project.scripts]
quorum = "quorum.cli:main"
quorum-mcp = "quorum.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quorum"]
include = ["quorum/rules/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["ISC004", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E402"]
"tests/*" = ["E501"]
